# Ablation: same-size causal LM (AR) baseline trained on same data.
extends: ../main.yaml
run:
  name: cd200m-ar-only
  output_dir: checkpoints/ar_only
model:
  use_grad_checkpoint: true
data:
  ast_mask_prob: 0.0
  fim_prob: 0.0
train:
  objective: causal_lm
sampler:
  diffusion_steps: 1
  confidence_remask: false
  ar_refine: false
