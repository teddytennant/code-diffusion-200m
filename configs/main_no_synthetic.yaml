# Variant of main.yaml that drops the synthetic source.
# Used until ANTHROPIC_API_KEY is provided. Once synthetic data is ready,
# switch back to configs/main.yaml.
run:
  name: cd200m-main
  seed: 42
  output_dir: checkpoints/main
  log_every: 25
  ckpt_every: 250
  wandb_project: code-diffusion-200m
  dataloader_workers: 4

model:
  vocab_size: 49154
  hidden_dim: 1024
  num_layers: 12
  num_heads: 16
  head_dim: 64
  mlp_hidden: 2730
  max_seq_len: 4096
  rope_base: 10000.0
  norm_eps: 1.0e-5
  tie_embeddings: true
  use_grad_checkpoint: true
  dropout: 0.0

data:
  sources:
    # CodeParrot Python (open) standing in for StarCoder2 (gated). JSONL
    # consumed via the `synthetic` reader (same on-the-fly tokenization
    # path as the synthetic source — no behavioral difference).
    - {path: data/starcoder2/python.jsonl, kind: synthetic, weight: 1.0}
  seq_len: 4096
  ast_mask_prob: 0.7
  fim_prob: 0.10
  mask_ratio_min: 0.05
  mask_ratio_max: 0.50

train:
  # Right-sized for an overnight A100 run (~12-14 hr at SDPA throughput,
  # ~8-9 hr with flash-attn). Spec calls for 8B but realistic budget is ~1.5B.
  # The corpus is ~1B tokens of unique text; we'll cycle ~1.5x through it.
  total_tokens: 1_500_000_000
  per_device_batch: 6
  grad_accum_steps: 22
  precision: bf16
  optimizer:
    name: adamw_8bit
    lr: 3.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.1
    eps: 1.0e-8
  schedule:
    name: wsd
    warmup_pct: 0.05
    stable_pct: 0.85
    decay_pct: 0.10
    decay_shape: quadratic
  curriculum:
    mask_ratio_phase_pct: 0.30
  flash_attention: true
  z_loss_weight: 1.0e-4

sampler:
  diffusion_steps: 16
  confidence_remask: true
  ar_refine: true
  ar_refine_threshold: 0.7
  temperature: 0.2
