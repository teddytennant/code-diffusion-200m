# RTX 5060 Ti 16GB single-GPU config.
#
# Inherits the open-data run (CodeParrot Python, no synthetic / no HF gate)
# and retunes for 16GB VRAM + Blackwell consumer throughput.
#
# Why these numbers:
#   - The A100 smoke hit ~25GB peak at per_device_batch 6 (DEVLOG 2026-05-10).
#     The hog is the [B, 4096, 49154] logits tensor (~402MB/sample, doubled for
#     its grad). Dropping B 6 -> 2 cuts that ~3x; peak lands ~8-11GB on 16GB.
#   - grad_accum 64 keeps the effective batch at 2*64*4096 = 524,288 tokens,
#     matching the spec's ~512K-token target so the LR schedule still holds.
#   - flash_attention OFF: the flash-attn package has no clean Blackwell (sm_120)
#     wheel; F.scaled_dot_product_attention dispatches its own flash kernel that
#     works on sm_120, so you lose almost nothing.
#   - compile ON: ~1.3-1.7x on a single consumer card. If a compile error shows
#     up at step 0, set it false and you're back to the plain eager path.
#
# If you OOM anyway: drop per_device_batch to 1 (and grad_accum to 128), or
# set data.seq_len to 2048 (roughly halves step cost AND memory).
extends: main_no_synthetic.yaml

run:
  output_dir: checkpoints/5060ti
  dataloader_workers: 8

train:
  per_device_batch: 2
  grad_accum_steps: 64        # 2 * 64 * 4096 = 524,288 tokens / step
  flash_attention: false
  compile: true
